<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="IND OBFUSCATOR - single mode Luau transformer with Rubis hosting"><title>IND OBFUSCATOR</title><link rel="stylesheet" href="style.css"></head>
<body><div class="bg"></div><main class="wrap">
<header><div><div class="brand">IND <span>OBFUSCATOR</span></div><div class="by">Made By MR_GAMING1141</div></div><div class="pill">RUBIS MODE</div></header>
<section class="hero"><h1>IND OBFUSCATOR</h1><p>Transform your Luau locally, optionally upload the result to Rubiš, and generate a ready-to-copy loader.</p></section>
<section class="grid"><div class="card"><label for="source">Luau Source</label><textarea id="source" spellcheck="false" placeholder="Paste your Luau code here..."></textarea></div><div class="card options"><label class="check"><input id="rename" type="checkbox" checked> Identifier transformation</label><label class="check"><input id="strings" type="checkbox" checked> String encoding</label><label class="check"><input id="junk" type="checkbox" checked> Control-flow noise</label><label class="check"><input id="integrity" type="checkbox" checked> Integrity marker</label><label class="check"><input id="dtc" type="checkbox" checked> Roblox environment checks</label><label class="check"><input id="uploadRubis" type="checkbox" checked> Upload to Rubiš</label><button id="obfuscate">OBFUSCATE + UPLOAD</button><div id="status"></div></div></section>
<section class="card output"><div class="outhead"><label>Generated Loadstring</label><button id="copyLoader">COPY</button></div><textarea id="loader" readonly placeholder="loadstring(game:HttpGet(...))() appears here after a successful Rubiš upload"></textarea></section>
<section class="card output"><div class="outhead"><label>Rubiš Raw URL</label><button id="copyUrl">COPY</button></div><input id="rubisUrl" readonly placeholder="https://api.rubis.app/v2/scrap/.../raw"></section>
<section class="card output"><div class="outhead"><label>Protected Output</label><button id="copySource">COPY</button></div><textarea id="payload" readonly placeholder="Protected output appears here..."></textarea></section>
<footer>Obfuscation runs locally. Rubiš upload is only performed when enabled. No Pastefy or Vercel is used.</footer>
</main><script src="app.js"></script></body></html>
